<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a Sign</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">

    <button class="sign sign-1" data-sign="1" aria-label="Sign 1">
      <img src="Sign_Vector/Sign1.png" alt="One Way sign">
    </button>

    <button class="sign sign-2" data-sign="2" aria-label="Sign 2">
      <img src="Sign_Vector/Sign2.png" alt="Stop sign">
    </button>

    <button class="sign sign-3" data-sign="3" aria-label="Sign 3">
      <img src="Sign_Vector/Sign3.png" alt="Enter sign">
    </button>

    <button class="sign sign-4" data-sign="4" aria-label="Sign 4">
      <img src="Sign_Vector/Sign4.png" alt="Caution sign">
    </button>

    <button class="sign sign-5" data-sign="5" aria-label="Sign 5">
      <img src="Sign_Vector/Sign5.png" alt="Notice sign">
    </button>

    <button class="sign sign-6" data-sign="6" aria-label="Sign 6">
      <img src="Sign_Vector/Sign6.png" alt="Do Not Enter sign">
    </button>

    <button class="sign sign-7" data-sign="7" aria-label="Sign 7">
      <img src="Sign_Vector/Sign7.png" alt="Exit sign">
    </button>

    <button class="sign sign-8" data-sign="8" aria-label="Sign 8">
      <img src="Sign_Vector/Sign8.png" alt="Wait Here sign">
    </button>

    <button class="sign sign-9" data-sign="9" aria-label="Sign 9">
      <img src="Sign_Vector/Sign9.png" alt="Pedestrian walk sign">
    </button>

    <button class="sign sign-10" data-sign="10" aria-label="Sign 10">
      <img src="Sign_Vector/Sign10.png" alt="Keep Left sign">
    </button>

    <button class="sign sign-11" data-sign="11" aria-label="Sign 11">
      <img src="Sign_Vector/Sign11.png" alt="Pull sign">
    </button>

    <button class="sign sign-12" data-sign="12" aria-label="Sign 12">
      <img src="Sign_Vector/Sign12.png" alt="Push sign">
    </button>

  </main>
  <script src="script.js"></script>
</body>
</html>
